# Reusable Unity WebGL build + deploy pipeline for Luxodd game repos.
#
# Shape: build once (GameCI), deploy that exact artifact to staging
# automatically on every main push. Production only ships from a manual
# workflow_dispatch with promote-production=true — the same run builds,
# stages, and promotes one artifact. PR runs build only.
#
# (Environment required-reviewers would be the cleaner prod gate, but that
# needs GitHub Team for private repos. The `environment:` fields are kept
# so deployment history works and reviewers start enforcing if the org
# ever upgrades.)
#
# Callers pass secrets explicitly (never `secrets: inherit`) — see the
# `secrets:` block below for the exact set and the README for the caller
# snippet. These are org-level secrets:
#   UNITY_EMAIL, UNITY_PASSWORD, UNITY_LICENSE   (UNITY_SERIAL for Pro seats)
#   GAME_DEPLOY_API_KEY_STAGING, GAME_DEPLOY_API_KEY_PROD
#
# Callers must also pin this workflow to a commit SHA, not `@main`. The
# deploy script is fetched at `job.workflow_sha`, so pinning the caller
# pins the code that runs with production credentials. Pinning to a branch
# leaves both movable.
#
# The calling repo must define environments `staging` and `production`.
# Required reviewers need GitHub Team on private repos, which we don't
# have, so `environment:` alone does not gate production — the explicit
# refs/heads/main check in deploy-production is what actually holds.
name: Unity WebGL Deploy (reusable)

on:
  workflow_call:
    inputs:
      game-id-staging:
        description: "Game UUID in the staging DB"
        type: string
        required: true
      game-id-production:
        description: "Game UUID in the production DB"
        type: string
        required: true
      server-url-staging:
        type: string
        required: false
        default: "https://staging-app.luxodd.com"
      server-url-production:
        type: string
        required: false
        default: "https://app.luxodd.com"
      project-path:
        description: "Path to the Unity project within the repo"
        type: string
        required: false
        default: "."
      runner:
        description: >-
          Runner label for the build job. Default is GitHub-hosted
          ubuntu-latest. Point at a self-hosted label (e.g. "unity-builder")
          to build on your own hardware: zero GitHub minutes, and the ~8GB
          Unity image + Library cache persist on local disk between runs
          (no re-pull, no 7-day eviction), which roughly halves wall-clock.
        type: string
        required: false
        default: "ubuntu-latest"
      deploy:
        description: "Deploy after building (false for PR validation builds)"
        type: boolean
        required: false
        default: true
      promote-production:
        description: "Also deploy to production (manual dispatch only)"
        type: boolean
        required: false
        default: false

    # Declared explicitly rather than relying on `secrets: inherit`. Inherit
    # hands this workflow every secret the calling repo can see, including
    # ones it has no business reading; naming them keeps the blast radius to
    # what the build and deploy actually need, and makes a missing secret a
    # clear error instead of an empty string at runtime.
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_LICENSE:
        required: true
      UNITY_SERIAL:
        # Pro seats only; Personal licences don't have one.
        required: false
      GAME_DEPLOY_API_KEY_STAGING:
        # Not required: PR validation runs build only (deploy=false).
        required: false
      GAME_DEPLOY_API_KEY_PROD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: WebGL build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      # The Unity editor image + Library folder need more disk than a
      # GitHub-hosted runner has free by default. Guarded to hosted only:
      # this rm would delete real files on a self-hosted machine.
      - name: Free disk space
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ inputs.project-path }}/Library
          key: Library-WebGL-${{ hashFiles(format('{0}/Packages/manifest.json', inputs.project-path), format('{0}/Packages/packages-lock.json', inputs.project-path), format('{0}/ProjectSettings/ProjectVersion.txt', inputs.project-path)) }}
          restore-keys: |
            Library-WebGL-

      - name: Build
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ inputs.project-path }}
          targetPlatform: WebGL
          # The platform's game version is minted server-side at deploy time;
          # GameCI's semantic versioning would also fail outright on repos
          # whose LFS migration leaves the tree dirty at checkout.
          versioning: None

      - name: Zip build (contents at root, as the kiosk expects)
        run: |
          sudo chown -R "$USER" build
          index=$(find build/WebGL -maxdepth 3 -name index.html | head -1)
          if [ -z "$index" ]; then
            echo "::error::no index.html in build output — WebGL build failed?"
            find build -maxdepth 3 -type d
            exit 1
          fi
          cd "$(dirname "$index")"
          zip -r -q "$GITHUB_WORKSPACE/game.zip" .
          du -h "$GITHUB_WORKSPACE/game.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-zip-${{ github.sha }}
          path: game.zip
          retention-days: 14
          if-no-files-found: error

  deploy-staging:
    name: Deploy to staging
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Preflight
        if: inputs.game-id-staging == ''
        run: |
          echo "::error::game-id-staging is empty — set the LUXODD_GAME_ID_STAGING repository variable (Settings > Secrets and variables > Actions > Variables) to this game's UUID in the staging DB."
          exit 1

      - name: Checkout deploy script from global-ci
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Pin the deploy code to the exact commit of the reusable workflow
          # that was invoked, not to a mutable branch. Without this a caller
          # can pin this workflow's YAML and still execute different script
          # content, with production deploy credentials in scope.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: game-zip-${{ github.sha }}

      - name: Deploy
        env:
          SERVER_URL: ${{ inputs.server-url-staging }}
          GAME_ID: ${{ inputs.game-id-staging }}
          DEPLOY_KEY: ${{ secrets.GAME_DEPLOY_API_KEY_STAGING }}
          ZIP_PATH: game.zip
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: bash scripts/deploy-game.sh

  deploy-production:
    name: Deploy to production
    needs: [build, deploy-staging]
    if: inputs.deploy && inputs.promote-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      # Fail closed on the source branch. `promote-production` is a
      # workflow_dispatch input, so without this check anyone who can
      # dispatch could ship an arbitrary branch straight to production.
      # The `environment:` above is not a gate on its own — required
      # reviewers need GitHub Team on private repos, which we don't have.
      #
      # This is an explicit failing step rather than a job-level `if` so a
      # wrong-branch dispatch is loud instead of a silently skipped job.
      - name: Refuse production deploys from non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::production promotion is only allowed from refs/heads/main (got '${{ github.ref }}'). Re-run the dispatch from main."
          exit 1

      - name: Preflight
        if: inputs.game-id-production == ''
        run: |
          echo "::error::game-id-production is empty — set the LUXODD_GAME_ID_PROD repository variable (Settings > Secrets and variables > Actions > Variables) to this game's UUID in the production DB."
          exit 1

      - name: Checkout deploy script from global-ci
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Pin the deploy code to the exact commit of the reusable workflow
          # that was invoked, not to a mutable branch. Without this a caller
          # can pin this workflow's YAML and still execute different script
          # content, with production deploy credentials in scope.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: game-zip-${{ github.sha }}

      - name: Deploy
        env:
          SERVER_URL: ${{ inputs.server-url-production }}
          GAME_ID: ${{ inputs.game-id-production }}
          DEPLOY_KEY: ${{ secrets.GAME_DEPLOY_API_KEY_PROD }}
          ZIP_PATH: game.zip
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: bash scripts/deploy-game.sh
